name: Container Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'backend/requirements.txt'
      - 'frontend/package*.json'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scans every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-backend:
    name: Scan Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t vuln-manager-backend:${{ github.sha }} -f backend/Dockerfile backend/
        
      - name: Run Trivy vulnerability scanner (Table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: Run Trivy vulnerability scanner (SARIF output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'container-backend'
          
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  scan-frontend:
    name: Scan Frontend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t vuln-manager-frontend:${{ github.sha }} -f frontend/Dockerfile frontend/
        
      - name: Run Trivy vulnerability scanner (Table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: Run Trivy vulnerability scanner (SARIF output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'container-frontend'
          
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vuln-manager-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  scan-docker-compose:
    name: Scan Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          
      - name: Run Trivy config scanner (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload config scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'config-scan'
