# Dependabot configuration for automated dependency updates
# Monitors Docker base images, Python packages, and npm packages
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Monitor backend Dockerfile for base image updates
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "Docker"
      include: "scope"
    reviewers:
      - "aphesz"
    
  # Monitor frontend Dockerfile for base image updates
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "Docker"
      include: "scope"
    reviewers:
      - "aphesz"
  
  # Monitor Python dependencies (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "Python"
      include: "scope"
    reviewers:
      - "aphesz"
    # Group security updates together
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    
  # Monitor npm dependencies (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "npm"
      include: "scope"
    reviewers:
      - "aphesz"
    # Ignore specific packages if needed
    # ignore:
    #   - dependency-name: "react"
    #     update-types: ["version-update:semver-major"]
    
  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "CI"
      include: "scope"
    reviewers:
      - "aphesz"
